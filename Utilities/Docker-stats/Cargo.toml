[package]
name = "docker-stats"
version = "0.1.0"
edition = "2021"
description = "Docker Container & Process Monitor (egui + bollard)"

[dependencies]
eframe = "0.27"
egui_plot = "0.27"
egui_extras = "0.27"
bollard = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
chrono = "0.4"

[profile.release]
lto = "thin"
strip = true
